# Everything a container with no compositor can check: licences, ruff, vulture,
# qmllint, shellcheck, the three test suites (the QML one runs on Qt's offscreen
# platform) and that the wheel builds with the chord database in it. The jobs run the same `make` targets a local machine runs,
# so a red pipeline reproduces here. The screenshot harness (`make shots`) and
# the real-shell check in docs/testing.md need KDE libraries and stay local.

# Prebuilt on the runner (ci/Dockerfile) so jobs do not run pacman -Syu each. Override with
# CHORDIST_CI_IMAGE=archlinux:latest if the image is ever missing; the before_script then installs.
variables:
  CHORDIST_CI_IMAGE: localhost/chordist-ci:latest

image: $CHORDIST_CI_IMAGE

stages: [check, test]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  before_script:
    # ORDER MATTERS: pacman installs git, so it must run before the first git call.
    # Install only if this is not the CI image (override or fallback) or it is stale (ci/packages.txt changed).
    - '[ "$(cat /etc/ci-packages 2>/dev/null)" = "$(cat ci/packages.txt)" ] || pacman -Syu --noconfirm --needed --quiet $(cat ci/packages.txt)'
    - git config --global --add safe.directory '*'

reuse:
  stage: check
  script: [make lint-reuse]

python:
  stage: check
  script: [make lint-python, make lint-deadcode]

# The image has Qt but not Plasma or Kirigami, so qmllint cannot resolve those types
# here. Everything else still counts: syntax, unused imports, signal and property
# mistakes in our own components. The full check, with the KDE modules, is `make lint`
# on a machine that has Plasma.
qml:
  stage: check
  variables:
    QMLLINT_FLAGS: >-
      --import disable --unresolved-type disable --missing-property disable
      --incompatible-type disable --unresolved-alias disable --alias-cycle disable --required disable
  script: [make lint-qml]

shell:
  stage: check
  script: [make lint-shell]

python-tests:
  stage: test
  script: [make test-python]

js-tests:
  stage: test
  script: [make test-js]

qml-tests:
  stage: test
  script: [make test-qml]

build:
  stage: test
  script: [make check-build]
