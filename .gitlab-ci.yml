# SPDX-FileCopyrightText: 2026 Ritwick Verma <verma1997@gmail.com>
#
# SPDX-License-Identifier: MIT
# Everything a container with no compositor can check: licences, ruff, vulture, qmllint, shellcheck, the three
# test suites (the QML one runs on Qt's offscreen platform), that the wheel builds with the chord database in it,
# that the Arch package builds, passes namcap and installs, and that the code still runs on the other Python
# versions and distributions it claims to support. The jobs run the same `make` targets a local machine runs, so
# a red pipeline reproduces here. A tag `vX.Y.Z` also cuts the release (docs/releasing.md). The screenshot
# harness (`make shots`) and the real-shell check in docs/testing.md need a display session and stay local.

# Prebuilt on the runner (ci/Dockerfile) so jobs do not run pacman -Syu each. Override with
# CHORDIST_CI_IMAGE=archlinux:latest if the image is ever missing; the before_script then installs.
variables:
  CHORDIST_CI_IMAGE: localhost/chordist-ci:latest

image: $CHORDIST_CI_IMAGE

stages: [check, test, release]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/

default:
  before_script:
    # ORDER MATTERS: pacman installs git, so it must run before the first git call.
    # Install only if this is not the CI image (override or fallback) or it is stale (ci/packages.txt changed).
    - '[ "$(cat /etc/ci-packages 2>/dev/null)" = "$(cat ci/packages.txt)" ] || pacman -Syu --noconfirm --needed --quiet $(cat ci/packages.txt)'
    - git config --global --add safe.directory '*'

reuse:
  stage: check
  script: [make lint-reuse]

python:
  stage: check
  script: [make lint-python, make lint-deadcode]

# qmllint needs Plasma and Kirigami to resolve the widget's KDE types. The CI image carries them (ci/packages.txt,
# since 2026-11-12: installing ~1.2 GB here took qml and qml-tests to ~3 min each); the pacman line below only
# brings them up to today's Arch versions, so the lint still runs against the newest stack. Same in qml-tests.
qml:
  stage: check
  script:
    - pacman -Syu --noconfirm --needed --quiet plasma-workspace libplasma kirigami kcmutils qqc2-desktop-style
    - make lint-qml

shell:
  stage: check
  script: [make lint-shell]

python-tests:
  stage: test
  script: [make test-python]

js-tests:
  stage: test
  script: [make test-js]

# The song-model test, and every component created against the newest KDE stack (Arch is rolling: Kirigami, Plasma
# and Qt as they are today). debian-trixie below does the same against the oldest one the widget claims. The same
# job renders the real popup headless (make shots: needs a font, hence ttf-dejavu) and keeps the PNGs, so a UI
# change can be looked at from the merge request.
qml-tests:
  stage: test
  script:
    - pacman -Syu --noconfirm --needed --quiet plasma-workspace libplasma kirigami kcmutils qqc2-desktop-style ttf-dejavu
    - make test-qml
    - make shots
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - build/shots/*.png

build:
  stage: test
  script: [make check-build]

# The Arch package, built from this tree by a normal user, namcap-checked (an E: fails the job), installed and
# run; then the AUR files for the same tarball, built and compared. See ci/package-arch.sh. Installs the
# package's own depends (Plasma included) on top of the CI image.
package-arch:
  stage: test
  script: [ci/package-arch.sh]
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - build/aur/PKGBUILD
      - build/aur/chordist.install
      - build/aur/.SRCINFO
      - build/pkg/*.pkg.tar.zst
      - build/namcap-*.log

# ---- compatibility --------------------------------------------------------------------------------------------
# The service is standard library only, so a bare Python image plus pytest is the whole environment
# (and make: one test drives `make install`).
python-compat:
  stage: test
  image: python:$PYTHON-slim
  before_script: []
  parallel:
    matrix:
      - PYTHON: ["3.12", "3.13", "3.14"]
  script:
    - python --version
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends make
    - pip install --quiet --no-cache-dir 'pytest>=8'
    - python -m pytest -p no:cacheprovider

# Debian's own Qt 6.8 (qmltestrunner ships in qt6-declarative-dev-tools; the QML modules are packaged apart),
# Kirigami 6.13 and Plasma 6.3, Python 3.13 and Node 20: the oldest runtimes the project meets in a mainstream
# distribution (Ubuntu 25.04 has the same Qt and KDE). The components test creates every widget component against
# that Kirigami, which is what would have caught Kirigami.Chip.interactive (KF 6.16) in 2.0.0. Debian ships
# org.kde.plasma.plasmoid and .configuration in no package, so main.qml and config.qml are skipped there, in the
# open (tests/qml/tst_components.qml says why).
debian-trixie:
  stage: test
  image: debian:trixie
  before_script: []
  script:
    - apt-get update -qq
    - >-
      apt-get install -y -qq --no-install-recommends make python3 python3-pytest nodejs
      qt6-declarative-dev-tools qml6-module-qttest qml6-module-qtquick
      plasma-workspace libplasma6 qml6-module-org-kde-kirigami qml6-module-org-kde-kcmutils qml6-module-org-kde-desktop
    - python3 -m pytest -p no:cacheprovider
    - make test-js
    - make test-qml

# `make install` into a throwaway home, with Fedora's own Python, make and kpackagetool6: the file layout, the
# launcher finding its library under the prefix, and uninstall leaving nothing behind. See ci/install-layout.sh.
fedora-install:
  stage: test
  image: fedora:45
  before_script: []
  script:
    - dnf install -y -q --setopt=install_weak_deps=False make python3 which kf6-kpackage libplasma
    - ci/install-layout.sh

# ---- release (tag vX.Y.Z only) --------------------------------------------------------------------------------
# Runs after every job above is green. Checks the tag against VERSION, builds the tarball from the tagged tree,
# generates the AUR files for it, uploads the tarball to the project's generic package registry (which keeps it for as
# long as the project exists; the project setting must be on), and creates the GitLab release with the changelog
# section as its notes and that package file as its asset. GitLab's `.../releases/vX.Y.Z/downloads/chordist-X.Y.Z.tar.gz`
# redirects to it, and that is the URL the AUR package downloads. The job's own artifacts are only a convenience
# (the AUR files, the tarball) and expire. See ci/release.sh and docs/releasing.md.
release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  resource_group: release
  interruptible: false
  script: [ci/release.sh]
  artifacts:
    expire_in: 1 month
    paths:
      - dist/chordist-*.tar.gz
      - build/aur/PKGBUILD
      - build/aur/chordist.install
      - build/aur/.SRCINFO
